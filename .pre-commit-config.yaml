default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: local
  hooks:
  - id: commit-msg-50-72
    name: "Commit message is scope: description and follows 50/72"
    entry: python tools/check_commit_msg.py
    language: python
    stages: [commit-msg]
