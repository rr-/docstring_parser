[build-system]
requires = ["uv_build >= 0.13.5, < 0.14"]
build-backend = "uv_build"

[project]
name = "docstring_parser"
version = "0.18.0"
description = "Parse Python docstrings in reST, Google and Numpydoc format"
authors = [
    {name="Marcin Kurczewski", email="dash@wind.garden"},
]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
classifiers = [
    "Environment :: Other Environment",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

[project.urls]
homepage = "https://github.com/rr-/docstring_parser"
repository = "https://github.com/rr-/docstring_parser"
changelog = "https://github.com/rr-/docstring_parser/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest",
]
docs = [
    "pydoctor >= 25.4.0; python_version>='3.11'",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "prek",
]

[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["docstring_parser/tests"]

[tool.ruff]
line-length = 79
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL"]
ignore = [
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PLW2901",  # redefined-loop-name
]
