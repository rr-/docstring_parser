name: Build

on:
  push:
    branches: [master]
    tags:
      - '[0-9]*'
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run tests
      run: uv run --locked --no-default-groups --group test pytest

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: j178/prek-action@v3.1.0

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: ./dist/*

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [tests, style, build-package]
    environment:
      name: pypi
      url: https://pypi.org/p/docstring-parser
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
